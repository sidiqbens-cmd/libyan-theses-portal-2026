<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مرصد السحب العلمي العربي | Arab Retraction Watch</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma; margin: 0; background: #e9ecef; font-size: 11px; color: #212529; }
        .header-top { background: #343a40; color: white; padding: 5px 15px; display: flex; justify-content: space-between; align-items: center; }
        .table-container { width: 100%; overflow-x: auto; margin-top: 5px; }
        table { width: 100%; border-collapse: collapse; background: white; border: 1px solid #666; }
        th { background: #6c757d; color: white; border: 1px solid #444; padding: 4px; font-weight: normal; }
        td { border: 1px solid #ccc; padding: 4px; vertical-align: top; }
        
        /* تصميم القائمة المنسدلة لتكون مكثفة جداً */
        select { 
            font-size: 10px; 
            width: 100%; 
            border: 1px solid #999; 
            background: #f9f9f9;
            padding: 1px;
        }
        .row-yellow { background: #ffffd2; }
    </style>
</head>
<body>

<div class="header-top">
    <span>Arab Retraction Watch Database (ARW)</span>
    <span>نظام محاكاة MARC21 | إصدار 2026</span>
</div>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th style="width: 30%;">بيانات البحث (العنوان/المؤلف/المجلة)</th>
                <th style="width: 40%;">سبب السحب (قائمة شاملة)</th>
                <th style="width: 15%;">التاريخ / DOI</th>
                <th style="width: 15%;">طبيعة السحب</th>
            </tr>
        </thead>
        <tbody>
            <tr class="row-yellow">
                <td>
                    <strong>تطبيقات الذكاء الاصطناعي في المكتبات</strong><br>
                    <span style="color: #555;">الصديق بن سليمان؛ محمد بن موسى</span>
                </td>
                <td>
                    <select>
                        <option value="">-- اختر السبب من القائمة العالمية --</option>
                        <option>عدم استجابة المؤلف (Author Unresponsive)</option>
                        <option>قضايا الانحياز أو نقص التوازن (Bias Issues)</option>
                        <option>خرق السياسات من قبل المؤلف (Breach of Policy)</option>
                        <option>الاستشهاد بعمل مسحوب (Cites Retracted Work)</option>
                        <option>إجراءات مدنية (Civil Proceedings)</option>
                        <option>شكاوى ضد المؤلف (Complaints about Author)</option>
                        <option>اختراق مراجعة النظراء (Compromised Peer Review)</option>
                        <option>قضايا تتعلق ببيانات البحث (Concerns About Data)</option>
                        <option>قضايا تتعلق بالصور (Concerns About Image)</option>
                        <option>قضايا تتعلق بالنتائج/الاستنتاجات (Concerns About Results)</option>
                        <option>تضارب المصالح (Conflict of Interest)</option>
                        <option>مطالبات حقوق النشر (Copyright Claims)</option>
                        <option>تكرار البحث (Duplication of Article)</option>
                        <option>تكرار البيانات (Duplication of Data)</option>
                        <option>تكرار النصوص (Duplication of Text)</option>
                        <option>خطأ من المجلة/الناشر (Error by Journal/Publisher)</option>
                        <option>خطأ في التحليلات (Error in Analyses)</option>
                        <option>خطأ في البيانات (Error in Data)</option>
                        <option>انتهاكات أخلاقية (Ethical Violations)</option>
                        <option>تزييف/تزوير البيانات (Falsification/Fabrication of Data)</option>
                        <option>تزييف/تزوير الصور (Falsification/Fabrication of Image)</option>
                        <option>انتحال/سرقة علمية (Plagiarism of Article)</option>
                        <option>انتحال نصوص (Plagiarism of Text)</option>
                        <option>محتوى مولد آلياً/ذكاء اصطناعي (Computer-Generated Content)</option>
                        <option>نتائج غير قابلة للتكرار (Results Not Reproducible)</option>
                        <option>نشر سلامي/تقطيع البيانات (Salami Slicing)</option>
                        <option>مأخوذ من رسالة جامعية (Taken from Dissertation/Thesis)</option>
                        <option>بيانات غير موثوقة (Unreliable Data)</option>
                    </select>
                </td>
                <td>2026-05-12<br>10.1000/arw.1</td>
                <td>Retraction</td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
